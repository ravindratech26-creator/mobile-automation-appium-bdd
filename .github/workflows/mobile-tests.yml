name: Mobile UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly schedule paused - uncomment to re-enable the 01:30 UTC full regression
  # schedule:
  #   - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression"
        default: "@smoke"
        required: true
      run_ios:
        description: "Also run the iOS simulator job"
        type: boolean
        default: false
      run_browserstack:
        description: "Also run on BrowserStack real devices (uses trial minutes)"
        type: boolean
        default: false

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: "2.7.1"
  RELEASES: https://github.com/saucelabs/sample-app-mobile/releases/download
  # push/PR -> smoke, nightly -> regression, manual -> chosen tags
  TAGS: ${{ github.event.inputs.tags || (github.event_name == 'schedule' && '@regression') || '@smoke' }}
  # Fresh CI devices: never skip Appium's device setup (see Step 13 notes)
  SKIP_DEVICE_INITIALIZATION: "false"
  EXPLICIT_WAIT_SECONDS: "30"

jobs:
  android:
    name: Android (emulator API 33)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2

      - name: Download Android app
        run: |
          mkdir -p apps
          curl -fsSL -o apps/SauceLabs.apk "$RELEASES/$APP_VERSION/Android.SauceLabs.Mobile.Sample.app.$APP_VERSION.apk"

      - name: Start Appium server
        run: |
          mkdir -p target/logs
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp > target/logs/appium-server.log 2>&1 &
          timeout 60 bash -c 'until curl -s http://127.0.0.1:4723/status | grep -q ready; do sleep 2; done'

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mvn -B test -Dplatform=android -Dapp.path=apps/SauceLabs.apk -Ddevice.name=emulator-5554 -Dplatform.version=13 "-Dcucumber.filter.tags=${{ env.TAGS }}"

      - name: Build Allure report
        if: always()
        run: mvn -B -q allure:report

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          retention-days: 14
          path: |
            target/site/allure-maven-plugin
            target/cucumber-reports
            target/screenshots
            target/logs

  ios:
    name: iOS (simulator) - experimental
    # Opt-in: manual run with run_ios=true, or nightly. Non-blocking until the iOS
    # locators (written but not yet executed - no Mac available) are proven here.
    if: github.event.inputs.run_ios == 'true' || github.event_name == 'schedule'
    continue-on-error: true
    # 2020 sample-app simulator build is x86_64-only -> needs an Intel runner, not Apple Silicon
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium@3
          appium driver install xcuitest

      - name: Download iOS simulator app
        run: |
          mkdir -p apps
          curl -fsSL -o apps/ios-sim.zip "$RELEASES/$APP_VERSION/iOS.Simulator.SauceLabs.Mobile.Sample.app.$APP_VERSION.zip"
          unzip -q apps/ios-sim.zip -d apps
          APP=$(find apps -maxdepth 2 -name "*.app" -type d | head -1)
          echo "IOS_APP=$APP" >> "$GITHUB_ENV"

      - name: Pick and boot an available iPhone simulator
        run: |
          # Simulator names/versions change with every runner image, so detect instead of hard-coding
          read -r UDID NAME VERSION < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      version = runtime.split("iOS-")[-1].replace("-", ".")
                      print(d["udid"], d["name"].replace(" ", "_"), version)
                      sys.exit(0)
          ')
          echo "Using $NAME ($VERSION) $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_NAME=${NAME//_/ }" >> "$GITHUB_ENV"
          echo "SIM_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Start Appium server
        run: |
          mkdir -p target/logs
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp > target/logs/appium-server.log 2>&1 &
          timeout 60 bash -c 'until curl -s http://127.0.0.1:4723/status | grep -q ready; do sleep 2; done'

      - name: Run tests on iOS simulator
        run: mvn -B test -Dplatform=ios "-Dapp.path=$IOS_APP" "-Ddevice.name=$SIM_NAME" "-Dplatform.version=$SIM_VERSION" "-Dcucumber.filter.tags=${{ env.TAGS }}"

      - name: Build Allure report
        if: always()
        run: mvn -B -q allure:report

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          retention-days: 14
          path: |
            target/site/allure-maven-plugin
            target/cucumber-reports
            target/screenshots
            target/logs

  browserstack:
    name: BrowserStack ${{ matrix.platform }} (real device)
    # Opt-in only: free-trial minutes are limited. Needs repo secrets
    # BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY (Settings -> Secrets and variables -> Actions).
    if: github.event.inputs.run_browserstack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            asset: Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
          - platform: ios
            asset: iOS.RealDevice.SauceLabs.Mobile.Sample.app.2.7.1.ipa
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_BUILD_NAME: github-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Upload app to BrowserStack
        run: |
          mkdir -p apps
          curl -fsSL -o "apps/${{ matrix.asset }}" "$RELEASES/$APP_VERSION/${{ matrix.asset }}"
          bash scripts/browserstack-upload.sh ${{ matrix.platform }} "apps/${{ matrix.asset }}"

      - name: Run tests on BrowserStack
        # Cloud allocates one device per session, so scenarios can run in parallel (trial allows limited sessions)
        run: mvn -B test -Dplatform=${{ matrix.platform }} -Denv=browserstack -Dthreads=2 "-Dcucumber.filter.tags=${{ env.TAGS }}"

      - name: Build Allure report
        if: always()
        run: mvn -B -q allure:report

      - name: Upload reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-${{ matrix.platform }}-reports
          retention-days: 14
          path: |
            target/site/allure-maven-plugin
            target/cucumber-reports
            target/screenshots
            target/logs
