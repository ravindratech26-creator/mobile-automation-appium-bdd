# ---------------------------------------------------------------
# Shared settings for every platform / environment.
# Override any key with an env var (EXPLICIT_WAIT_SECONDS=20)
# or a system property (-Dexplicit.wait.seconds=20).
# ---------------------------------------------------------------

# Synchronisation - explicit waits only, implicit wait kept at 0
explicit.wait.seconds=15
poll.interval.millis=500

# Appium session
new.command.timeout=120

# Parallel execution (local device pool)
# Comma-separated udids, one scenario per device at a time. Empty = single device.name mode.
#   mvn test -Dthreads=2 -Ddevices=emulator-5554,emulator-5556
devices=
# Unique per-session ports on one Appium server: base + device slot index
system.port.base=8200
wda.port.base=8100

# Reliability
retry.count=1
screenshot.on.failure=true

# Test data
user.standard=standard_user
user.locked=locked_out_user
user.password=secret_sauce
