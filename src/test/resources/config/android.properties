# Android - local execution (emulator or USB device)
appium.server.url=http://127.0.0.1:4723
platform.name=Android
automation.name=UiAutomator2
device.name=Pixel 6 API 33
platform.version=13

# Absolute or project-relative path (override per machine: -Dapp.path=... or APP_PATH env var)
app.path=D:/WebDriverIO_Mobile_POC_V2/apps/SauceLabs.apk
app.wait.activity=*
app.wait.for.launch=false

# Optional - Appium reads these from the apk when omitted
app.package=
app.activity=

no.reset=false
auto.grant.permissions=true

# Cold emulators / CI agents are slow to install + start the UiAutomator2 server (default 30s)
uia2.server.launch.timeout=90000
uia2.server.install.timeout=90000
adb.exec.timeout=60000

# Speed + stability
# Animations off: taps never land mid-transition (fewer flaky clicks) and screens settle faster
disable.window.animation=true
# Skip re-installing Appium's settings helper each session. Safe on an emulator that already ran
# one session; set SKIP_DEVICE_INITIALIZATION=false for a brand-new CI emulator.
skip.device.initialization=true
