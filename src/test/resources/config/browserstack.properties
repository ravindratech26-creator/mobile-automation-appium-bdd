# BrowserStack App Automate - shared cloud settings (-Denv=browserstack)
# Credentials are NEVER stored here. Set env vars:
#   BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY
appium.server.url=https://hub.browserstack.com/wd/hub
bs.project.name=SauceLabs Sample App
bs.build.name=local-build
bs.debug=true
bs.network.logs=false
bs.video=true

# Cloud devices are slower to respond than local ones
explicit.wait.seconds=25
