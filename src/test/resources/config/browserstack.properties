# BrowserStack App Automate - shared cloud settings (-Denv=browserstack)
#
# Credentials are NEVER stored here. They resolve from env vars / CI secrets:
#   browserstack.username   <- BROWSERSTACK_USERNAME
#   browserstack.access.key <- BROWSERSTACK_ACCESS_KEY
# App id (bs://...) comes from scripts/browserstack-upload.sh -> BROWSERSTACK_APP_ANDROID / _IOS
appium.server.url=https://hub-cloud.browserstack.com/wd/hub

bs.project.name=SauceLabs Sample App
# CI overrides per run: BS_BUILD_NAME="github-${run_number}" / "jenkins-${BUILD_NUMBER}"
bs.build.name=local-build
bs.debug=true
bs.network.logs=false
bs.video=true

# Real cloud devices respond slower than a local emulator
explicit.wait.seconds=25
# Cloud devices are allocated per session - no local device pool
devices=
